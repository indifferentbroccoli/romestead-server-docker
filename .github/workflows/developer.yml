---
name: Developer image
on:
  push:
    branches:
      - main
jobs:
  push:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::notice::DOCKER_USERNAME/DOCKER_PASSWORD not set; skipping Docker Hub dev image (GHCR image is built by docker-publish.yml)."
      - name: Checkout
        if: env.HAS_DOCKERHUB == 'true'
        uses: actions/checkout@v4
      - name: Docker - Login
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'
      - name: Set up Docker Buildx
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Docker - Metadata
        if: env.HAS_DOCKERHUB == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository }}
          tags: 'type=raw,value=dev'
          flavor: latest=false
      - name: Docker - Build / Push
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          tags: '${{ steps.meta.outputs.tags }}'